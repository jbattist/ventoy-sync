ventoy_path: /run/media/joe/VENTOY
backup_path: /mnt/iso/template/iso
isos:
  archlinux:
    name: Arch Linux
    rename: true
    method: regex
    url: https://archlinux.org/download/
    regex: archlinux-(\d{4}\.\d{2}\.\d{2})-x86_64\.iso
    download_url_template: https://mirror.rackspace.com/archlinux/iso/{version}/archlinux-{version}-x86_64.iso
    filename_template: archlinux-{version}-x86_64.iso
  endeavouros:
    name: EndeavourOS
    rename: true
    method: regex
    url: https://endeavouros.com/latest-release/
    regex: EndeavourOS_([\w.-]+)\.iso
    download_url_template: https://mirror.alpix.eu/endeavouros/iso/EndeavourOS_{version}.iso
    filename_template: EndeavourOS_{version}.iso
  cachyos:
    name: CachyOS
    rename: true
    method: regex
    url: https://mirror.cachyos.org/ISO/desktop/
    regex: href="(\d{6})/"
    regex_last: true
    download_url_template: https://mirror.cachyos.org/ISO/desktop/{version}/cachyos-desktop-linux-{version}.iso
    filename_template: cachyos-desktop-linux-{version}.iso
  ubuntu_lts:
    name: Ubuntu 24.04 LTS (Desktop)
    rename: true
    method: regex
    url: https://releases.ubuntu.com/noble/
    regex: ubuntu-(24\.04\.\d+)-desktop-amd64\.iso
    download_url_template: https://releases.ubuntu.com/noble/ubuntu-{version}-desktop-amd64.iso
    filename_template: ubuntu-{version}-desktop-amd64.iso
  proxmox_ve:
    name: Proxmox VE
    rename: true
    method: regex
    url: https://www.proxmox.com/en/downloads/proxmox-virtual-environment/iso
    regex: proxmox-ve_([\d.-]+)\.iso
    download_url_template: https://enterprise.proxmox.com/iso/proxmox-ve_{version}.iso
    filename_template: proxmox-ve_{version}.iso
  proxmox_backup:
    name: Proxmox Backup Server
    rename: true
    method: regex
    url: https://www.proxmox.com/en/downloads/proxmox-backup-server/iso
    regex: proxmox-backup-server_([\d.-]+)\.iso
    download_url_template: https://enterprise.proxmox.com/iso/proxmox-backup-server_{version}.iso
    filename_template: proxmox-backup-server_{version}.iso
  linuxmint:
    name: Linux Mint (Cinnamon)
    rename: true
    method: regex
    url: https://www.linuxmint.com/download.php
    regex: Linux Mint ([\d.]+)
    download_url_template: https://mirrors.kernel.org/linuxmint/stable/{version}/linuxmint-{version}-cinnamon-64bit.iso
    filename_template: linuxmint-{version}-cinnamon-64bit.iso
  zorinos:
    name: Zorin OS (Core)
    rename: true
    method: regex
    url: https://mirrors.edge.kernel.org/zorinos-isos/18/
    regex: Zorin-OS-(?P<major>\d+)-Core-64-bit(?P<rev>-r\d+)?\.iso
    regex_last: true
    download_url_template: https://mirrors.edge.kernel.org/zorinos-isos/{major}/Zorin-OS-{major}-Core-64-bit{rev}.iso
    filename_template: Zorin-OS-{major}-Core-64-bit{rev}.iso
  truenas_scale:
    name: TrueNAS SCALE
    rename: true
    method: regex
    url: https://www.truenas.com/download-truenas-scale/
    regex: TrueNAS-SCALE-([\d.]+)\.iso
    download_url_template: https://download.truenas.com/TrueNAS-SCALE-Goldeye/{version}/TrueNAS-SCALE-{version}.iso
    filename_template: TrueNAS-SCALE-{version}.iso
  hirens_bootcd:
    name: Hiren's BootCD PE
    rename: true
    method: headers
    download_url: https://www.hirensbootcd.org/files/HBCD_PE_x64.iso
  clonezilla:
    name: Clonezilla
    rename: true
    method: regex
    url: https://clonezilla.org/downloads.php
    regex: <b>stable</b>\s*-\s*<font[^>]*>([\d.-]+)</font>
    download_url_template: https://master.dl.sourceforge.net/project/clonezilla/clonezilla_live_stable/{version}/clonezilla-live-{version}-amd64.iso?viasf=1
    filename_template: clonezilla-live-{version}-amd64.iso
    user_agent: Wget/1.21.3
  rescuezilla:
    name: Rescuezilla
    rename: true
    method: regex
    url: https://github.com/rescuezilla/rescuezilla/releases/latest
    regex: rescuezilla-([\d.]+)-64bit\.\w+\.iso
    download_url_template: https://github.com/rescuezilla/rescuezilla/releases/download/{version}/rescuezilla-{version}-64bit.noble.iso
    filename_template: rescuezilla-{version}-64bit.noble.iso
  gparted_live:
    name: GParted Live
    rename: true
    method: regex
    url: https://gparted.org/download.php
    regex: gparted-live-([\d.-]+)-amd64\.iso
    download_url_template: https://master.dl.sourceforge.net/project/gparted/gparted-live-stable/{version}/gparted-live-{version}-amd64.iso?viasf=1
    filename_template: gparted-live-{version}-amd64.iso
    user_agent: Wget/1.21.3
  systemrescue:
    name: SystemRescue
    rename: true
    method: regex
    url: https://www.system-rescue.org/Download/
    regex: systemrescue-([\d.]+)-amd64\.iso
    download_url_template: https://fastly-cdn.system-rescue.org/releases/{version}/systemrescue-{version}-amd64.iso
    filename_template: systemrescue-{version}-amd64.iso
  windows11:
    name: Windows 11
    rename: true
    method: headers
    download_url: ''
    enabled: false
  fedora_workstation:
    name: Fedora Workstation
    rename: true
    method: regex
    url: https://fedoraproject.org/releases.json
    regex: Fedora-Workstation-Live-(?P<major>\d+)-(?P<build>[\d.]+)\.x86_64\.iso
    download_url_template: https://download.fedoraproject.org/pub/fedora/linux/releases/{major}/Workstation/x86_64/iso/Fedora-Workstation-Live-{major}-{build}.x86_64.iso
    filename_template: Fedora-Workstation-Live-{major}-{build}.x86_64.iso
  fedora_everything:
    name: Fedora Everything (netinst)
    rename: true
    method: regex
    url: https://fedoraproject.org/releases.json
    regex: Fedora-Everything-netinst-x86_64-(?P<major>\d+)-(?P<build>[\d.]+)\.iso
    download_url_template: https://download.fedoraproject.org/pub/fedora/linux/releases/{major}/Everything/x86_64/iso/Fedora-Everything-netinst-x86_64-{major}-{build}.iso
    filename_template: Fedora-Everything-netinst-x86_64-{major}-{build}.iso
  debian_live:
    name: Debian Live (GNOME)
    rename: true
    method: regex
    url: https://cdimage.debian.org/cdimage/release/current-live/amd64/iso-hybrid/
    regex: debian-live-([\d.]+)-amd64-gnome\.iso
    download_url_template: https://cdimage.debian.org/cdimage/release/current-live/amd64/iso-hybrid/debian-live-{version}-amd64-gnome.iso
    filename_template: debian-live-{version}-amd64-gnome.iso
  nixos:
    name: NixOS (Minimal)
    rename: true
    method: regex
    url: https://nixos.org/download/
    regex: channels\.nixos\.org/nixos-([\d.]+)/latest-nixos-minimal-x86_64-linux\.iso
    download_url_template: https://channels.nixos.org/nixos-{version}/latest-nixos-minimal-x86_64-linux.iso
    filename_template: nixos-minimal-{version}-x86_64-linux.iso
  tails:
    name: Tails
    rename: true
    method: regex
    url: https://tails.net/install/download/
    regex: tails-amd64-([\d.]+)\.iso
    download_url_template: https://download.tails.net/tails/stable/tails-amd64-{version}/tails-amd64-{version}.iso
    filename_template: tails-amd64-{version}.iso
  kali_linux:
    name: Kali Linux (Installer)
    rename: true
    method: regex
    url: https://cdimage.kali.org/current/
    regex: kali-linux-([\d.]+)-installer-amd64\.iso
    download_url_template: https://cdimage.kali.org/kali-{version}/kali-linux-{version}-installer-amd64.iso
    filename_template: kali-linux-{version}-installer-amd64.iso
  kde_neon:
    name: KDE Neon (User Edition)
    rename: true
    method: regex
    url: https://neon.kde.org/download
    regex: neon-user-desktop-(\d{8}-\d{4})\.iso
    download_url_template: https://files.kde.org/neon/images/desktop/user/{version}/neon-user-desktop-{version}.iso
    filename_template: neon-user-desktop-{version}.iso
  archcraft:
    name: Archcraft
    rename: true
    method: headers
    download_url: https://sourceforge.net/projects/archcraft/files/latest/download
    user_agent: Wget/1.21.3
  omarchy:
    name: Omarchy
    method: regex
    url: https://api.github.com/repos/basecamp/omarchy/releases/latest
    regex: iso\.omarchy\.org/omarchy-([\d.]+)\.iso
    download_url_template: https://iso.omarchy.org/omarchy-{version}.iso
    filename_template: omarchy-{version}.iso
  garuda_mokka:
    name: Garuda Linux (Mokka)
    rename: true
    method: regex
    url: https://iso.builds.garudalinux.org/iso/garuda/mokka/
    regex: href="garuda-mokka-linux-(?=[^"]+-(?P<version>\d{6})\.iso)(?P<kernel>[\w-]+)-(?P=version)\.iso"
    url_template: https://iso.builds.garudalinux.org/iso/garuda/mokka/{latest_dir}/
    directory_url: https://iso.builds.garudalinux.org/iso/garuda/mokka/
    directory_regex: href="(?P<latest_dir>\d{6})/"
    directory_regex_last: true
    download_url_template: https://iso.builds.garudalinux.org/iso/garuda/mokka/{version}/garuda-mokka-linux-{kernel}-{version}.iso
    filename_template: garuda-mokka-linux-{kernel}-{version}.iso
  memtest86plus:
    name: Memtest86+
    rename: true
    method: regex
    url: https://memtest.org/
    regex: /download/v([\d.]+)/mt86plus_[\d.]+_x86_64\.iso\.zip
    download_url_template: https://memtest.org/download/v{version}/mt86plus_{version}_x86_64.iso.zip
    filename_template: mt86plus_{version}_x86_64.iso
    unzip: true
  shredos:
    name: ShredOS
    rename: true
    method: regex
    url: https://api.github.com/repos/PartialVolume/shredos.x86_64/releases/latest
    regex: browser_download_url":\s*"https://github\.com/PartialVolume/shredos\.x86_64/releases/download/(?P<tag>[^/]+)/(?P<fname>shredos-[\w._-]+_x86-64_v[\d.]+_\d+)\.iso"
    download_url_template: https://github.com/PartialVolume/shredos.x86_64/releases/download/{tag}/{fname}.iso
    filename_template: '{fname}.iso'
  dban:
    name: DBAN - Disk Wiper
    rename: true
    method: fixed
    version: 2.3.0
    download_url: https://master.dl.sourceforge.net/project/dban/dban/dban-2.3.0/dban-2.3.0_i586.iso?viasf=1
    filename: dban-2.3.0_i586.iso
    user_agent: Wget/1.21.3
  ubuntu_server:
    name: Ubuntu 24.04 LTS (Server)
    rename: true
    method: regex
    url: https://releases.ubuntu.com/noble/
    regex: ubuntu-(24\.04\.\d+)-live-server-amd64\.iso
    download_url_template: https://releases.ubuntu.com/noble/ubuntu-{version}-live-server-amd64.iso
    filename_template: ubuntu-{version}-live-server-amd64.iso
